[Bottle]
Template = win10_64
Description = fixture

[ManagedUpdatePolicy]
Policy = manual

[EnvironmentVariables]
;;"PROMPT" = "$p$g"
"CX_BOTTLE_CREATOR_APPID" = "com.codeweavers.c4.206"
"CX_GRAPHICS_BACKEND" = "wine"
"WINEMSYNC" = "1"
"WINEDLLOVERRIDES" = "d3d11,dxgi=b"
"DXVK_HUD" = "fps"
# --- native NVK (managed by nvk-bottle.sh) ---
"WINEDLLOVERRIDES" = "d3d11,dxgi=n"
"DXVK_CONFIG" = "dxvk.enableDescriptorBuffer = False"
"DXVK_HUD" = "devinfo,fps,frametimes"
"DXVK_LOG_LEVEL" = "info"
"WINEMSYNC" = "1"
"DYLD_LIBRARY_PATH" = "/Library/GPUBundles/nvmtl/wine/lib"
# --- native NVK (managed by nvk-bottle.sh) ---
